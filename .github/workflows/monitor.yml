name: monitor

# Production, measured on a schedule: a smoke test every day, Lighthouse every Monday. A failure
# opens (or updates) one issue, so a regression is never silent.
on:
  schedule:
    - cron: '0 12 * * *' # 07:00 in Lima, 06:00 in Mexico City
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      AGENDA_URL: ${{ vars.AGENDA_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Smoke test
        run: node scripts/checks/smoke.ts "$SITE_URL" | tee "$RUNNER_TEMP/report.txt"
      - name: Agenda health (the Google token)
        if: env.AGENDA_URL != ''
        run: curl -sf "$AGENDA_URL/health" | tee -a "$RUNNER_TEMP/report.txt"
      - name: Lighthouse (Mondays and manual runs)
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%u)" = 1 ]; then
            pnpm perf --ci --url "$SITE_URL" 2>&1 | tee -a "$RUNNER_TEMP/report.txt"
          fi
      - name: Keep the result
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/report.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-${{ github.run_id }}
          path: ${{ runner.temp }}/report.txt
          retention-days: 90
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Producción: el monitoreo falló"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
